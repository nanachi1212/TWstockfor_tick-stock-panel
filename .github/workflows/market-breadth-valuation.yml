name: Market Breadth and Valuation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/taiwan/market_breadth*'
      - 'backend/app/taiwan/market_valuation.py'
      - 'backend/app/api/market_breadth.py'
      - 'backend/app/taiwan/corporate_actions.py'
      - 'backend/app/taiwan/fundamentals.py'
      - 'backend/app/taiwan/observed_universe.py'
      - 'backend/app/taiwan/pit_universe.py'
      - 'backend/tests/test_market_breadth_valuation.py'
      - '.github/workflows/market-breadth-valuation.yml'

jobs:
  research-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev --python 3.11
      - name: Ruff
        run: uv run ruff check app/taiwan/market_breadth.py app/taiwan/market_breadth_service.py app/taiwan/market_valuation.py app/api/market_breadth.py app/taiwan/fundamentals.py app/taiwan/corporate_actions.py app/taiwan/observed_universe.py app/taiwan/pit_universe.py tests/test_market_breadth_valuation.py
      - name: mypy
        run: uv run mypy --follow-imports=silent --ignore-missing-imports app/taiwan/market_breadth.py app/taiwan/market_breadth_service.py app/taiwan/market_valuation.py app/api/market_breadth.py app/taiwan/fundamentals.py app/taiwan/corporate_actions.py app/taiwan/observed_universe.py app/taiwan/pit_universe.py
      - name: Research and data contract regression
        run: uv run pytest -q tests/test_market_breadth_valuation.py tests/test_taiwan_pit_universe.py tests/test_taiwan_observed_universe.py tests/test_taiwan_fundamentals.py tests/test_taiwan_daily_store.py tests/test_taiwan_market_intelligence.py tests/test_taiwan_corporate_actions.py tests/test_taiwan_pit_adjustment.py tests/test_market_research.py -m 'not integration'
      - name: Diff and changed-file privacy gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA" HEAD
          uv run python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from app.release_privacy import audit_release_paths, assert_privacy_pass
          root = Path('..').resolve()
          names = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], cwd=root).decode().splitlines()
          paths = [root / name for name in names if (root / name).is_file()]
          assert_privacy_pass(audit_release_paths(paths, scope='source'))
          print('Changed-file privacy / secret scan PASS')
          PY
