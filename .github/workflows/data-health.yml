name: Data Health Center

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/taiwan/data_health*'
      - 'backend/app/api/data_health.py'
      - 'backend/tests/test_data_health_center.py'
      - 'frontend/**'
      - '.github/workflows/data-health.yml'

jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev --python 3.11
      - name: Ruff
        run: uv run ruff check app/taiwan/data_health_center.py app/taiwan/data_health_jobs.py app/api/data_health.py app/taiwan/finmind_cache.py app/taiwan/selection_review_service.py tests/test_data_health_center.py
      - name: Metadata/API type check
        run: uv run mypy --follow-imports=silent app/taiwan/data_health_center.py app/taiwan/data_health_jobs.py app/api/data_health.py
      - name: Metadata and updater regression
        run: uv run pytest -q tests/test_data_health_center.py tests/test_taiwan_daily_update.py tests/test_taiwan_daily_refresh.py tests/test_taiwan_selection_review.py tests/test_taiwan_realtime.py tests/test_taiwan_security_master.py tests/test_taiwan_market_intelligence.py tests/test_taiwan_social_sentiment_api.py -m 'not integration'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
