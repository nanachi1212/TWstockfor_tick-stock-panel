# stock-sdk 内置可选数据源插件
# ⚠️ 合规提示: 本插件通过 stock-sdk 抓取第三方财经网站(如东方财富)的行情接口,
#    未经对方授权,可能违反其服务条款并涉及交易所行情版权问题。
#    Docker 默认不打包(INCLUDE_STOCKSDK=0);启用即视为使用者知悉并自行承担合规责任。
#    开发模式下需手动安装依赖: cd backend/app/plugins/stocksdk && npm install

name: stocksdk
display_name: "stock-sdk"
runtime: node
entry: app.plugins.stocksdk.provider:StockSDKProvider
check: app.plugins.stocksdk.bridge:availability
datasets: [daily, adj_factor, minute, realtime]
description: "選用的中國 A 股資料來源，提供日 K、除權息因子、分鐘 K 與即時行情。資料取自第三方財經網站，可能受存取限制；使用前請確認資料授權與使用條款。執行環境需有 Node.js 18 以上版本。"
install_hint: "此資料來源尚未就緒。可嘗試點選「安裝」；若仍無法使用，請聯絡系統維護者確認必要元件已備妥。"
